name: Category route and multi-category contract

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  category-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm category:contract
      - run: pnpm category:contract:negative
